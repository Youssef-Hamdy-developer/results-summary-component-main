<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Frontend Mentor | Results summary component</title>
  </head>
  <body>
    <div class="card">
      <div class="left">
        <h3>Your Result</h3>
        <div class="number"><span class="big-num">76</span> of 100</div>
        <h2>Great</h2>
        <p>
          You scored higher than 65% of <br />
          the people who have taken <br />
          these tests.
        </p>
      </div>
      <div class="right">
        <h3>Summary</h3>
        <div class="summary-item reaction">
          <span class="tag">
            <img src="assets/images/icon-reaction.svg" alt="">
            Reaction</span>
          <div class="score"><b>80</b> / 100</div>
        </div>

        <div class="summary-item memory">
          <span class="tag">
            <img src="assets/images/icon-memory.svg" alt="">
            Memory</span>
          <div class="score"><b>92</b> / 100</div>
        </div>

        <div class="summary-item verbal">
          <span class="tag">
            <img src="assets/images/icon-verbal.svg" alt="">
            Verbal</span>
          <div class="score"><b>61</b> / 100</div>
        </div>

        <div class="summary-item visual">
          <span class="tag">
            <img src="assets/images/icon-visual.svg" alt="">
            Visual</span>
          <div class="score"><b>72</b> / 100</div>
        </div>
        <button>Continue</button>
      </div>
    </div>
    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">eng.Youssef-Hamdy</a>.
    </footer>
  </body>
</html>
